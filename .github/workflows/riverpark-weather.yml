name: Update River Park weather
on:
  # Scheduled updates run hourly on pi5. This is a manual recovery option.
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: riverpark-weather
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            field-sites/riverpark
            scripts/riverpark
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public station archive
        run: python scripts/riverpark/update.py
      - name: Commit observations
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add field-sites/riverpark/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update River Park weather observations'
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase origin master
          done
          exit 1
      - name: Build GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
